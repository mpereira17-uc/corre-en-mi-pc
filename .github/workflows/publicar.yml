name: Actualizar y publicar

# Una vez al día revisa Steam, guarda los requisitos en data/ y publica el sitio en GitHub Pages.
on:
  schedule:
    - cron: "23 9 * * *"   # 4:23 a. m. hora de Colombia
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # solo para guardar data/ cuando cambia
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pruebas
        run: python -m unittest discover -s tests -t .
      - name: Leer Steam y generar el sitio
        run: python generar.py
      - name: Guardar datos si cambiaron
        run: |
          git config user.name "corre-bot"
          git config user.email "corre-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar requisitos desde Steam"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  desplegar:
    needs: actualizar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
